services:
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: minio_server
    restart: unless-stopped
    # Starts MinIO server and binds the Console UI to port 9001
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT}:${MINIO_API_HOST_PORT}"         # S3 API (Port 9000)
      - "${MINIO_CONSOLE_HOST_PORT}:${MINIO_CONSOLE_HOST_PORT}" # Web Console (Port 9001)
    env_file:
      - .env
    volumes:
      - minio_data:/data
    networks:
      - shared-network

volumes:
  minio_data:

networks:
  shared-network:
    name: devops-shared-network
    external: true