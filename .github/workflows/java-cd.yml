name: Java App CD

# Trigger this workflow only AFTER the "Java App CI" workflow completes
on:
  workflow_run:
    workflows: ["Java App CI"] # This MUST exactly match the "name:" in your CI file
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    # CRUCIAL: Only deploy if the CI pipeline actually succeeded (didn't fail tests/build)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}         # e.g., 192.168.1.100
          username: ${{ secrets.VPS_USERNAME }} # e.g., ubuntu or root
          key: ${{ secrets.VPS_SSH_KEY }}       # Your Private SSH Key (If you used a password instead, change this to: password: ${{ secrets.VPS_PASSWORD }})
          
          # These are the commands that will run directly on your VM
          script: |
            # 1. Navigate to your specific app folder on the server
            # ⚠️ CHANGE THIS PATH to where your repo lives on your VM
            cd /home/vagrant/java-app/github-action-projects/java-app
            
            # 2. Pull the latest repository code (in case you changed docker-compose.yml or .env)
            git pull origin main
            
            # 3. Pull the latest Docker Image from Docker Hub 
            # (Very important because your tag is always 1.0.0, we must force it to download the new one)
            docker-compose pull
            
            # 4. Recreate and restart the container with the new image
            docker-compose up -d