name: Java App CD

# Trigger this workflow only AFTER the "Java App CI" workflow completes
on:
  workflow_run:
    workflows: ["Java App CI"] # This MUST exactly match the "name:" in your CI file
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    # CRUCIAL: Only deploy if the CI pipeline actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # This grabs the full .env content from GitHub Secrets
          DOT_ENV_CONTENT: ${{ secrets.JAVA_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}         
          username: ${{ secrets.VPS_USERNAME }} 
          key: ${{ secrets.VPS_SSH_KEY }}       
          
          # We pass the env variable into the SSH session using 'envs'
          envs: DOT_ENV_CONTENT
          
          script: |
            cd /home/vagrant

            # Check if the repository is already cloned. If not, clone it!
            # (Replace 'YourUsername' with your actual GitHub username!)
            if [ ! -d "github-action-projects" ]; then
              git clone git@github.com:DibyashworHamal/github-action-projects.git
            fi

            cd github-action-projects/java-app

            # Pull the latest repository code
            git pull origin main
            
            # Overwrite the .env file with the latest contents from GitHub Secrets
            echo "$DOT_ENV_CONTENT" > .env
            
            # Pull the latest Docker Image from Docker Hub 
            docker compose pull
            
            # Recreate and restart the container with the new image
            docker compose up -d