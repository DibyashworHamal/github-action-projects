name: Java App CI/CD Pipeline

on:
  workflow_dispatch: # <--- THIS ENABLES THE MANUAL BUTTON IN GITHUB UI!
  push:
    branches: [ "main" ]
    paths:
      - 'java-app/**' # Triggers only when java-app folder changes
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-app/**'

jobs:
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Code
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build Package
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker image build -t ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.1 .

      - name: Push Docker Image to Docker Hub
        run: |
          docker image push ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.1

  deploy:
    name: Continuous Deployment (CD)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV_CONTENT: ${{ secrets.JAVA_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOT_ENV_CONTENT
          script: |
            # 1. Ensure project root directory exists and navigate inside it
            mkdir -p /home/ubuntu/github-action-projects
            cd /home/ubuntu/github-action-projects

            # 2. Clone repo if missing, otherwise pull latest code
            if [ ! -d ".git" ]; then
              git clone https://github.com/DibyashworHamal/github-action-projects.git .
            else
              git pull origin main
            fi

            # 3. Navigate into java-app directory
            cd java-app

            # 4. Inject Java application environment variables
            echo "$DOT_ENV_CONTENT" > .env

            # 5. Ensure external shared network exists
            docker network create devops-shared-network 2>/dev/null || true

            # 6. Pull the latest Docker Hub image and deploy
            docker compose pull
            docker compose up -d