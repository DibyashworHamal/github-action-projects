name: Java App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'java-app/**' # Only trigger if files in this folder change!
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-app/**'

jobs:
  # ==========================================
  # CI JOB: Runs on GitHub's Cloud Servers
  # ==========================================
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest # This runs on GitHub's cloud, not your VM
    defaults:
      run:
        working-directory: ./java-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Code
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker image build -t ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.0 .

      - name: Push Docker Image to Docker Hub
        run: |
          docker image push ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.0

  # ==========================================
  # CD JOB: Runs inside Vagrant VM
  # ==========================================
  deploy:
    name: Continuous Deployment (CD)
    needs: build # THIS IS THE MAGIC WORD! It makes it downstream of 'build'
    runs-on: self-hosted # THIS IS THE FIX! It tells GitHub to run this job inside your VM

    steps:
      - name: Deploy Application locally on VM
        env:
          # Grabs the full .env content from GitHub Secrets securely
          DOT_ENV_CONTENT: ${{ secrets.JAVA_ENV_FILE }}
          
        # Notice we don't use 'appleboy/ssh-action' anymore. 
        # We just use 'run' because this is executing directly inside the VM!
        run: |
          # 1. Go to the vagrant user's home directory
          cd /home/vagrant

          # 2. Check if the repository is already cloned. If not, clone it!
          if [ ! -d "github-action-projects" ]; then
            git clone https://github.com/DibyashworHamal/github-action-projects.git
          fi

          # 3. Navigate into the java-app folder
          cd github-action-projects/java-app

          # 4. Pull the latest repository code (in case docker-compose.yml changed)
          git pull origin main
          
          # 5. Overwrite the .env file with the latest contents from GitHub Secrets
          echo "$DOT_ENV_CONTENT" > .env
          
          # 6. Pull the latest Docker Image from Docker Hub 
          docker compose pull
          
          # 7. Recreate and restart the container with the new image
          docker compose up -d