name: Java App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'java-app/**' # Only trigger if files in this folder change!
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-app/**'

jobs:
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: compile
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker image build -t ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.0 .

      - name: Push Docker Image to Docker Hub
        run: |
          docker image push ${{ secrets.DOCKERHUB_USERNAME }}/ebs-java-app:1.0.0

      
  deploy:
    name: Contineous Deployment (CD)
    needs: build # THIS IS THE MAGIC WORD! It makes it downstream of 'build'
    runs-on: ubuntu-latest # Or runs-on: self-hosted if you use the local VM runner!

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # This grabs the full .env content from GitHub Secrets
          DOT_ENV_CONTENT: ${{ secrets.JAVA_ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}         
          username: ${{ secrets.VPS_USERNAME }} 
          key: ${{ secrets.VPS_SSH_KEY }}       
          
          # We pass the env variable into the SSH session using 'envs'
          envs: DOT_ENV_CONTENT
          
          script: |
            cd /home/vagrant

            # Check if the repository is already cloned. If not, clone it!
            # (Replace 'YourUsername' with your actual GitHub username!)
            if [ ! -d "github-action-projects" ]; then
              git clone git@github.com:DibyashworHamal/github-action-projects.git
            fi

            cd github-action-projects/java-app

            # Pull the latest repository code
            git pull origin main
            
            # Overwrite the .env file with the latest contents from GitHub Secrets
            echo "$DOT_ENV_CONTENT" > .env
            
            # Pull the latest Docker Image from Docker Hub 
            docker compose pull
            
            # Recreate and restart the container with the new image
            docker compose up -d