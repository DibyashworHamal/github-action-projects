name: Java App CI/CD Pipeline

on:
  workflow_dispatch: # <--- THIS ENABLES THE MANUAL BUTTON IN GITHUB UI!
  push:
    branches: [ "main" ]
    paths:
      - 'java-app/**' # Triggers only when java-app folder changes
  pull_request:
    branches: [ "main" ]
    paths:
      - 'java-app/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java-app
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Code
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build Package
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Built-in automatic token!

      - name: Build and Push Docker Image
        run: |
          # Convert username to lowercase to satisfy GHCR naming rules
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/ebs-java-app:1.0.0" | tr '[:upper:]' '[:lower:]')
          
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Send Email on CI Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Build #${{ github.run_number }} Failed - Event Booking System (CI)"
          to: hamaldivyashwor2057@gmail.com
          from: DevOps Team <${{ secrets.MAIL_USERNAME }}>
          body: |
            Hello Team,

            BUILD #${{ github.run_number }} of Event Booking System (CI) HAS FAILED.
            Please check the build details at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            DevOps Team  

  deploy:
    name: Continuous Deployment (CD)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    # manual approval step for production deployment
    environment:
      name: production


    steps:
      - name: Deploy Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV_CONTENT: ${{ secrets.JAVA_ENV_FILE }}
          GHCR_PAT: ${{ secrets.GHCR_PAT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOT_ENV_CONTENT
          script: |
            # 1. Ensure project root directory exists and navigate inside it
            mkdir -p /home/ubuntu/github-action-projects
            cd /home/ubuntu/github-action-projects

            # 2. Clone repo if missing, otherwise pull latest code
            if [ ! -d ".git" ]; then
              git clone https://github.com/DibyashworHamal/github-action-projects.git .
            else
              git pull origin main
            fi

            # 3. Navigate into java-app directory
            cd java-app

            # 4. Inject Java application environment variables
            echo "$DOT_ENV_CONTENT" > .env

            # 5. Log in to GitHub Container Registry (GHCR) to pull the latest image
            echo "$GHCR_PAT" | docker login ghcr.io -u dibyashworhamal --password-stdin

            # 6. Ensure external shared network exists
            docker network create devops-shared-network 2>/dev/null || true

            # 7. Pull the latest image and deploy
            docker compose pull
            docker container stop ebs-java-app || true  # Stops the container if it's running, but doesn't fail if it isn't
            docker container rm ebs-java-app || true    # Removes the container if it exists, but doesn't fail if it doesn't
            docker compose up -d

      # --- EMAIL NOTIFICATION ON CD SUCCESS ---
      - name: Send Email on Production Deployment Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Build #${{ github.run_number }} Successful - Event Booking System (Production)"
          to: hamaldivyashwor2057@gmail.com
          from: DevOps Team <${{ secrets.MAIL_USERNAME }}>
          body: |
            Hello Team,

            BUILD #${{ github.run_number }} of Event Booking System WAS SUCCESSFUL in Production!
            Build details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Application URL: https://ebs.dibyashworhamal.com.np

            Regards,
            DevOps Team

      # --- EMAIL NOTIFICATION ON CD FAILURE ---
      - name: Send Email on Production Deployment Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Build #${{ github.run_number }} Failed - Event Booking System (Production)"
          to: hamaldivyashwor2057@gmail.com
          from: DevOps Team <${{ secrets.MAIL_USERNAME }}>
          body: |
            Hello Team,

            BUILD #${{ github.run_number }} of Event Booking System (Production Deployment) HAS FAILED.
            Please check the build details at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            DevOps Team