name: WordPress CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual button click in GitHub Actions UI
  push:
    branches: [ "main" ]
    paths:
      - 'wordpress/**' # Triggers only when files in wordpress folder change

jobs:
  # CI JOB: Validates WordPress Configuration
  build:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wordpress

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env File for Validation
        env:
          DOT_ENV_CONTENT: ${{ secrets.WORDPRESS_ENV_FILE }}
        run: echo "$DOT_ENV_CONTENT" > .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # CD JOB: Deploys WordPress to AWS EC2
  deploy:
    name: Continuous Deployment (CD)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/wordpress
            echo "Deployment directory ready."

      - name: Copy Docker Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          source: "wordpress/docker-compose.yml"

          target: "/home/ubuntu/wordpress"

          strip_components: 1

      - name: Deploy WordPress via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV_CONTENT: ${{ secrets.WORDPRESS_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOT_ENV_CONTENT
          script: |
            # 1. Navigate to the deployment directory
            cd /home/ubuntu/wordpress

            # 2. Inject WordPress environment variables
            echo "$DOT_ENV_CONTENT" > .env

            # 3. Ensure external shared network exists
            docker network create devops-shared-network 2>/dev/null || true

            # 4. Pull WordPress image and launch container
            docker compose pull
            docker compose up -d