name: Database Deployment Pipeline

on:
  workflow_dispatch: # <--- THIS ENABLES THE MANUAL BUTTON IN GITHUB UI!
  push:
    branches: [ "main" ]
    paths:
      - 'database/**' # Triggers only when database folder changes

jobs:
  deploy-database:
    name: Deploy Database Services to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/database
            echo "Deployment directory ready."

      - name: Copy Docker Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          source: "database/docker-compose.yml"

          target: "/home/ubuntu/database/docker-compose.yml"

          strip_components: 1

      - name: Deploy Database via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV_CONTENT: ${{ secrets.DATABASE_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOT_ENV_CONTENT
          script: |
            # 1. Navigate to the deployment directory
            cd /home/ubuntu/database

            # 2. Inject database environment variables
            echo "$DOT_ENV_CONTENT" > .env

            # 3. Ensure external shared network exists
            docker network create devops-shared-network 2>/dev/null || true

            # 4. Pull images and launch containers
            docker compose pull
            docker compose up -d