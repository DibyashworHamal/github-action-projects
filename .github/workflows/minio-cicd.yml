name: MinIO Storage CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'minio/**'

jobs:
  deploy-minio:
    name: Deploy MinIO Object Storage to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Create Deployment Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/minio
            echo "Deployment directory ready."

      - name: Copy Docker Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          source: "minio/docker-compose.yml"

          target: "/home/ubuntu/minio"

          strip_components: 1

      - name: Deploy MinIO via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV_CONTENT: ${{ secrets.MINIO_ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOT_ENV_CONTENT
          script: |
            cd /home/ubuntu/minio
            echo "$DOT_ENV_CONTENT" > .env
            docker network create devops-shared-network 2>/dev/null || true
            docker compose pull
            docker compose up -d